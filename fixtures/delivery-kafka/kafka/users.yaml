apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: payment-service
  labels:
    strimzi.io/cluster: main
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: payments, patternType: literal }
        operations: [Write, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: ledger-service
  labels:
    strimzi.io/cluster: main
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: payments, patternType: literal }
        operations: [Read, Describe]
      - resource: { type: group, name: ledger, patternType: prefix }
        operations: [Read]
