openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                type: object
                required: [orderId, total]
                properties:
                  orderId: { type: string }
                  total: { type: number }
                  currency: { type: string }
