name: Set up pnpm
description: Node 24, pnpm from the "packageManager" field via Corepack, a cached store, and a frozen install.

inputs:
  registry-url:
    description: Passed to setup-node; the release job sets it for npm publishing.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        registry-url: ${{ inputs.registry-url }}

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
