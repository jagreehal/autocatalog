name: Changeset

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changeset:
    # Dependabot bumps need no changeset of their own; the next release picks them up.
    if: github.head_ref != 'changeset-release/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - name: Check for changeset
        run: pnpm changeset status --since=origin/main
