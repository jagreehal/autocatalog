name: Frameworks

# Each example in examples/frameworks/ writes its contracts from a test. This
# fails when those files are stale, when a language's catalog stops matching
# expected.json, or when drift misses a renamed field in it.
on:
  pull_request:
    paths:
      - 'examples/frameworks/**'
      - 'packages/events/**'
      - 'scripts/verify-frameworks.mjs'
      - '.github/workflows/frameworks.yml'
      - '.github/actions/**'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - 'examples/frameworks/**'
      - 'packages/events/**'
      - 'scripts/verify-frameworks.mjs'
      - '.github/workflows/frameworks.yml'
      - '.github/actions/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [rust, go, java, dotnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      # Rust is already on the runner.
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/frameworks/go/go.mod
          cache-dependency-path: examples/frameworks/go/go.sum

      - if: matrix.language == 'java'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - run: pnpm turbo run build --filter=autocatalog-cli...

      - run: pnpm verify:frameworks ${{ matrix.language }}
