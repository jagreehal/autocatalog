name: Delivery

# Proves delivery against a real broker: a throwaway RabbitMQ loads the
# fixture's definitions, `ac delivery verify` delivers each committed example,
# then a deleted binding must fail the same check.
on:
  pull_request:
    paths:
      - 'packages/events/core/src/delivery*.ts'
      - 'packages/events/cli/src/commands/delivery.ts'
      - 'fixtures/delivery-rabbitmq/**'
      - 'scripts/verify-delivery.mjs'
      - '.github/workflows/delivery.yml'
      - '.github/actions/**'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - 'packages/events/core/src/delivery*.ts'
      - 'packages/events/cli/src/commands/delivery.ts'
      - 'fixtures/delivery-rabbitmq/**'
      - 'scripts/verify-delivery.mjs'
      - '.github/workflows/delivery.yml'
      - '.github/actions/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rabbitmq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm turbo run build --filter=autocatalog-cli...

      - run: pnpm verify:delivery delivery-report

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-verification
          path: delivery-report/
          if-no-files-found: ignore
