name: E2E Smoke

# The packed packages, the Python adapter and the docs demo end to end: only
# when something they are built from changes.
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'python/**'
      - 'examples/docs-demo/**'
      - 'examples/site-extension/**'
      - 'examples/help-centre/**'
      - 'examples/event-storming/**'
      - 'examples/public-api/**'
      - 'scripts/e2e-smoke.sh'
      - 'scripts/pack-smoke.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/actions/**'
      - '.github/workflows/e2e-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'python/**'
      - 'examples/docs-demo/**'
      - 'examples/site-extension/**'
      - 'examples/help-centre/**'
      - 'examples/event-storming/**'
      - 'examples/public-api/**'
      - 'scripts/e2e-smoke.sh'
      - 'scripts/pack-smoke.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/actions/**'
      - '.github/workflows/e2e-smoke.yml'

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: ./.github/actions/setup-pnpm

      - name: Run E2E smoke script
        run: bash scripts/e2e-smoke.sh

      # The workspace links packages together; a user's npm install does not.
      - name: Install the packed packages and run the front door
        run: bash scripts/pack-smoke.sh

  # The Playwright stories are named `test:e2e`, so `turbo run test` never
  # reaches them. They build each site and drive the built output, which is
  # what gets published. Three jobs of two suites run side by side.
  stories:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The docs site, and the journeys the README's screenshots and GIFs
          # are recorded from, run fast and unrecorded.
          - name: docs and media
            suites: '@autocatalog-example/docs autocatalog-media'
            reports: examples/docs-demo
          # A site `ac site` builds as a server, white-labelled and extended,
          # and a help centre where one access module decides what each
          # account opens.
          - name: server sites
            suites: '@autocatalog-example/site-extension @autocatalog-example/help-centre'
            reports: examples/site-extension examples/help-centre
          # A process drafted from Effect code, drawn as an EventStorming
          # board, and API docs with Scalar's reference framed beside the site.
          - name: storming and public API
            suites: '@autocatalog-example/event-storming @autocatalog-example/public-api'
            reports: examples/event-storming examples/public-api
    name: stories (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      # Each suite builds its own site from the packages it depends on, in dist/.
      - name: Build what the suites depend on
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          filters=()
          for suite in $SUITES; do filters+=("--filter=$suite^..."); done
          pnpm turbo run build "${filters[@]}"

      - name: Locate Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The browser download, kept per Playwright version. The system packages
      # it needs are installed on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Every step here is time-boxed. `playwright install` has shipped releases
      # that hang after the browser download instead of failing
      # (microsoft/playwright#40998, in 1.55.1–1.59.x). Without a bound, that
      # burns the job to the six-hour default and reports nothing useful. The
      # lockfile pins 1.60.0 and the range is `^1.60.0`, so this repository
      # cannot resolve into that window; the timeout is for the next one.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Run stories
        timeout-minutes: 20
        env:
          SUITES: ${{ matrix.suites }}
        # Both suites run, so one failing does not hide the other.
        run: |
          failed=0
          for suite in $SUITES; do
            echo "=== $suite ==="
            pnpm --filter "$suite" test:e2e || failed=1
          done
          exit "$failed"

      - name: Collect story reports
        if: always()
        env:
          REPORTS: ${{ matrix.reports }}
        run: |
          mkdir -p story-reports
          for dir in $REPORTS; do
            for part in reports test-results; do
              [ -d "$dir/$part" ] && mkdir -p "story-reports/$dir" && cp -R "$dir/$part" "story-reports/$dir/"
            done
          done
          true

      - name: Upload story reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-stories-${{ strategy.job-index }}
          path: story-reports
          if-no-files-found: ignore
