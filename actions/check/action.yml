name: Autocatalog check
description: Check the documents, events and contracts a repository publishes, on every pull request.
branding:
  icon: check-circle
  color: blue
inputs:
  root:
    description: The folder to check.
    default: .
  allow-code-execution:
    description: Run the rules this repository commits. Leave off for pull requests from forks.
    default: 'false'
  consumers:
    description: Your company site's /catalog.json, so a breaking change names the consumers other repositories declare.
    default: ''
  consumers-token:
    description: A token for a private company site, sent when reading consumers.
    default: ''
  repository:
    description: This repository's name on the company site, when it differs from the repository's own.
    default: ''
  require-consumers:
    description: Fail when the consumers cannot be read, instead of checking without them.
    default: 'false'
  max-consumers-age:
    description: Hours the company site may be old before its consumers count as unreadable. Empty for no limit.
    default: ''
  comment:
    description: Keep one comment on the pull request with the result. Needs pull-requests write permission; a fork's pull request is skipped.
    default: 'true'
  version:
    description: The autocatalog version to run. Pinned to this release of the action.
    default: '0.1.17'
  node-version:
    description: The Node.js version to run it on.
    default: '24'
runs:
  using: composite
  steps:
    # The whole history: drift reads the base branch from it.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    - shell: bash
      env:
        ROOT: ${{ inputs.root }}
        VERSION: ${{ inputs.version }}
        BASE_REF: ${{ github.base_ref }}
        ALLOW_CODE: ${{ inputs.allow-code-execution }}
        CONSUMERS: ${{ inputs.consumers }}
        AUTOCATALOG_CONSUMERS_TOKEN: ${{ inputs.consumers-token }}
        REPOSITORY: ${{ inputs.repository }}
        REQUIRE_CONSUMERS: ${{ inputs.require-consumers }}
        MAX_CONSUMERS_AGE: ${{ inputs.max-consumers-age }}
        COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        args=(check "$ROOT" --format github)
        if [ -n "$BASE_REF" ]; then args+=(--base-ref "origin/$BASE_REF"); fi
        if [ "$ALLOW_CODE" = "true" ]; then args+=(--allow-code-execution); fi
        if [ -n "$CONSUMERS" ]; then args+=(--consumers "$CONSUMERS"); fi
        if [ -n "$AUTOCATALOG_CONSUMERS_TOKEN" ]; then args+=(--consumers-token-env AUTOCATALOG_CONSUMERS_TOKEN); fi
        if [ -n "$REPOSITORY" ]; then args+=(--repository "$REPOSITORY"); fi
        if [ "$REQUIRE_CONSUMERS" = "true" ]; then args+=(--require-consumers); fi
        if [ -n "$MAX_CONSUMERS_AGE" ]; then args+=(--max-consumers-age "$MAX_CONSUMERS_AGE"); fi
        if [ "$COMMENT" = "true" ] && [ -n "$BASE_REF" ]; then args+=(--comment); fi
        npx --yes "autocatalog@$VERSION" "${args[@]}"
